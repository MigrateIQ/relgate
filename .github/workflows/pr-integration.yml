---
name: PR integration
 
# The self-test workflow runs on push, so RelGate's pull_request-only paths
# (the PR comment, its dedupe, and fork handling) never execute there. This
# one runs on real pull requests to cover them.
on:
  pull_request:
 
permissions:
  contents: read
  pull-requests: write
 
jobs:
  comment-is-posted-once:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
 
      # Run twice on purpose: the second run must update the first run's
      # comment, not add another one.
      - uses: ./
        with:
          project-path: test-fixtures/clean/Clean.csproj
          changed-files-only: 'false'
          fail-on-issues: 'false'
      - uses: ./
        with:
          project-path: test-fixtures/clean/Clean.csproj
          changed-files-only: 'false'
          fail-on-issues: 'false'
 
      - name: Assert exactly one RelGate comment
        # Fork PRs get a read-only token and can't post, by design - the
        # step above must still have passed (non-fatal fallback), but
        # there's no comment to count.
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v9
        with:
          script: |
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const ours = comments.filter(
              (c) => c.body && c.body.includes('<!-- relgate-report -->')
            );
            if (ours.length !== 1) {
              core.setFailed(
                `expected exactly 1 RelGate comment, found ${ours.length}`
              );
            } else if (!ours[0].body.includes('Unused usings')) {
              core.setFailed('RelGate comment is missing its results table');
            }