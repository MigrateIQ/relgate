---
name: Release
 
# Push a tag like v1.2.3 to publish a release. This also moves the floating
# major tag (v1) to the same commit - that tag is what users reference
# (MigrateIQ/relgate@v1) and what pro/action.yml pins its nested free action
# to, so it must only ever move as part of a deliberate release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
 
permissions:
  contents: write
 
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Move the floating major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
 
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
 