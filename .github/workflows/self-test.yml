---
name: Self-test
 
on:
  push:
  workflow_dispatch:
 
permissions:
  contents: read
 
# Note: these fixtures are exercised via `push`/`workflow_dispatch`, never
# `pull_request`, so RelGate's own PR-comment step (gated on
# `github.event_name == 'pull_request'`) never runs here. That path isn't
# covered by this self-test.
#
# Assertion logic lives under .github/scripts/self-test/ rather than
# inline here, mirroring the same pro/scripts/ split used in pro/action.yml
# - steps stay declarative, scripts stay independently readable/testable.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install yamllint actionlint-py shellcheck-py
      - run: yamllint action.yml pro/action.yml
      - name: actionlint (workflows)
        run: actionlint
      - name: shellcheck (action scripts and self-test assertions)
        run: >-
          shellcheck -S warning scripts/*.sh pro/scripts/*.sh
          .github/scripts/self-test/*.sh
      - name: Unit tests (version comparison)
        run: bash .github/scripts/self-test/test-semver.sh
      - name: Unit tests (inline annotations)
        run: bash .github/scripts/self-test/test-annotate.sh
      - name: Unit tests (SARIF generation)
        run: bash .github/scripts/self-test/test-sarif.sh
      - name: Unit tests (baseline mode)
        run: bash .github/scripts/self-test/test-baseline.sh
      - name: Unit tests (Central Package Management)
        run: bash .github/scripts/self-test/test-cpm.sh
      - name: Unit tests (config file, path excludes, fail gates)
        run: |
          bash .github/scripts/self-test/test-config.sh
          bash .github/scripts/self-test/test-exclude.sh
          bash .github/scripts/self-test/test-fail-gate.sh
      - name: Syntax-check github-script blocks
        run: >-
          python .github/scripts/self-test/check-github-script.py
          action.yml pro/action.yml .github/workflows/pr-integration.yml
 
  free-tier-fixtures:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fixture: test-fixtures/clean/Clean.csproj
            assert: assert-clean-fixture.sh
          - fixture: test-fixtures/dirty/Dirty.csproj
            assert: assert-dirty-fixture.sh
          - fixture: test-fixtures/broken/Broken.csproj
            assert: assert-broken-build.sh
    steps:
      - uses: actions/checkout@v4
      - id: relgate
        uses: ./
        with:
          project-path: ${{ matrix.fixture }}
          changed-files-only: 'false'
          fail-on-issues: 'false'
      - name: Assert
        shell: bash
        env:
          USINGS: ${{ steps.relgate.outputs.usings-count }}
          NULLABLE: ${{ steps.relgate.outputs.nullable-count }}
          BUILD_FAILED: ${{ steps.relgate.outputs.build-failed }}
        run: bash .github/scripts/self-test/${{ matrix.assert }}
 
  # Every fixture above lives inside this same repo, so it inherits this
  # repo's own root .editorconfig (which enables IDE0005) - that alone
  # would never catch a regression to the "target repo has no
  # .editorconfig at all" case, which is exactly what broke silently on
  # a real external repo. Remove it here to actually exercise that path.
  usings-check-without-editorconfig:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove this repo's own .editorconfig for this job only
        run: mv .editorconfig /tmp/editorconfig-backup
      - id: relgate
        uses: ./
        with:
          project-path: test-fixtures/dirty/Dirty.csproj
          changed-files-only: 'false'
          fail-on-issues: 'false'
      - name: Restore this repo's .editorconfig
        if: always()
        run: mv /tmp/editorconfig-backup .editorconfig
      - name: Assert unused usings are still caught with no ambient config
        shell: bash
        env:
          USINGS: ${{ steps.relgate.outputs.usings-count }}
        run: |
          if [ "$USINGS" != "1" ]; then
            echo "::error::expected usings-count=1, got $USINGS"
            exit 1
          fi
 
  # .relgate.yml: an advisory check is still reported but must not fail the
  # job, even with fail-on-issues on (the dirty fixture has unused usings).
  config-advisory-severity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: relgate
        uses: ./
        with:
          project-path: test-fixtures/dirty/Dirty.csproj
          changed-files-only: 'false'
          fail-on-issues: 'true'
          config-file: test-fixtures/config/usings-advisory.yml
      - name: Assert usings were reported but did not fail the job
        shell: bash
        env:
          USINGS: ${{ steps.relgate.outputs.usings-count }}
        run: bash .github/scripts/self-test/assert-config-advisory.sh
 
  # .relgate.yml: findings in excluded paths are dropped before counting.
  config-excludes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: relgate
        uses: ./
        with:
          project-path: test-fixtures/dirty/Dirty.csproj
          changed-files-only: 'false'
          fail-on-issues: 'true'
          config-file: test-fixtures/config/exclude-dirty.yml
      - name: Assert excluded findings are not counted
        shell: bash
        env:
          USINGS: ${{ steps.relgate.outputs.usings-count }}
          NULLABLE: ${{ steps.relgate.outputs.nullable-count }}
        run: bash .github/scripts/self-test/assert-config-excluded.sh
 
  # An invalid config must fail loudly, never fall back to defaults.
  config-invalid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run RelGate with an invalid config, expecting failure
        id: relgate
        continue-on-error: true
        uses: ./
        with:
          project-path: test-fixtures/clean/Clean.csproj
          changed-files-only: 'false'
          fail-on-issues: 'false'
          config-file: test-fixtures/config/invalid.yml
      - name: Assert the step failed
        shell: bash
        env:
          OUTCOME: ${{ steps.relgate.outcome }}
          MESSAGE: expected RelGate to reject the invalid config
        run: bash .github/scripts/self-test/assert-step-failed.sh
 
  fail-on-issues-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run RelGate expecting it to fail
        id: relgate
        continue-on-error: true
        uses: ./
        with:
          project-path: test-fixtures/dirty/Dirty.csproj
          changed-files-only: 'false'
          fail-on-issues: 'true'
      - name: Assert the step actually failed
        shell: bash
        env:
          OUTCOME: ${{ steps.relgate.outcome }}
          MESSAGE: expected RelGate to fail on the dirty fixture
        run: bash .github/scripts/self-test/assert-step-failed.sh
 
  pro-licensed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start mock Lemon Squeezy server
        run: bash .github/scripts/self-test/start-mock-license-server.sh
      - id: relgate
        uses: ./pro
        with:
          project-path: test-fixtures/vulnerable/Vulnerable.csproj
          changed-files-only: 'false'
          fail-on-issues: 'false'
          license-key: valid-pro
          license-api-url: http://127.0.0.1:8085
          # Generation is asserted below. The upload itself is expected to
          # be rejected here (no security-events permission) and is
          # continue-on-error by design.
          upload-sarif: 'true'
      - name: Assert SARIF was generated
        shell: bash
        env:
          SARIF_PATH: ${{ steps.relgate.outputs.sarif-path }}
        run: bash .github/scripts/self-test/assert-sarif-generated.sh
      - name: Assert Pro checks actually ran
        shell: bash
        env:
          LICENSED: ${{ steps.relgate.outputs.licensed }}
          SCORE: ${{ steps.relgate.outputs.vuln-score }}
          FAILED: ${{ steps.relgate.outputs.vuln-readiness-failed }}
          SECRETS: ${{ steps.relgate.outputs.secrets-found }}
        run: bash .github/scripts/self-test/assert-pro-licensed.sh
 
  pro-rejected-license:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        license-key: [nonsense, valid-wrong-product]
    steps:
      - uses: actions/checkout@v4
      - name: Start mock Lemon Squeezy server
        run: bash .github/scripts/self-test/start-mock-license-server.sh
      - id: relgate
        uses: ./pro
        with:
          project-path: test-fixtures/clean/Clean.csproj
          fail-on-issues: 'true'
          license-key: ${{ matrix.license-key }}
          license-api-url: http://127.0.0.1:8085
      - name: Assert unlicensed and job did not fail
        shell: bash
        env:
          LICENSED: ${{ steps.relgate.outputs.licensed }}
        run: bash .github/scripts/self-test/assert-unlicensed.sh
 
  pro-api-unreachable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: relgate
        uses: ./pro
        with:
          project-path: test-fixtures/clean/Clean.csproj
          fail-on-issues: 'true'
          license-key: valid-pro
          license-api-url: http://127.0.0.1:8085
      - name: Assert fail-open when the license API is unreachable
        shell: bash
        env:
          LICENSED: ${{ steps.relgate.outputs.licensed }}
          OUTCOME: ${{ steps.relgate.outcome }}
        run: bash .github/scripts/self-test/assert-fail-open.sh