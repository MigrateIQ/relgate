---
name: "RelGate"
description: >-
  Know your .NET release is ready before you tag it. Flags unused usings,
  build warnings, and nullable issues in changed files.
author: "MigrateIQ"
branding:
  icon: "check-circle"
  color: "blue"
 
inputs:
  dotnet-version:
    description: ".NET SDK version to use"
    required: false
    default: "8.0.x"
  project-path:
    description: >-
      Path to a .sln or .csproj to restore/build/format. Leave blank to
      auto-detect a single project or solution at the repo root.
    required: false
    default: ""
  changed-files-only:
    description: "Only check files changed in the PR (true/false)"
    required: false
    default: "true"
  fail-on-issues:
    description: "Fail the check if blocking issues are found (true/false)"
    required: false
    default: "true"
  pr-size-threshold:
    description: >-
      File-count threshold above which the pr-size row is flagged as
      advisory (never blocking) in the report.
    required: false
    default: "20"
  config-file:
    description: >-
      Path to an optional RelGate config file (default '.relgate.yml').
      It sets per-check severity (blocking / advisory / off) and path
      excludes; see the README. A missing default file means defaults, but
      an explicitly named file that doesn't exist is an error.
    required: false
    default: ".relgate.yml"
  hide-pro-hint:
    description: >-
      Internal use only — set by pro/action.yml when it nests this action,
      so licensed Pro users don't see a hint to buy what they already
      have. Not part of the documented public input surface.
    required: false
    default: "false"
  skip-comment:
    description: >-
      Internal use only — set by pro/action.yml when it nests this action,
      so the free-tier comment isn't posted and then immediately
      overwritten by Pro's own unified comment a few minutes later. Not
      part of the documented public input surface.
    required: false
    default: "false"
 
outputs:
  usings-count:
    description: "Number of unused-using violations found"
    value: ${{ steps.usings.outputs.count }}
  nullable-count:
    description: "Number of nullable-warning occurrences found"
    value: ${{ steps.nullable.outputs.count }}
  build-failed:
    description: "true if the build failed to compile"
    value: ${{ steps.nullable.outputs.build_failed }}
  tool-error:
    description: "true if the unused-usings tool itself failed to run"
    value: ${{ steps.usings.outputs.tool_error }}
  pr-file-count:
    description: "Number of files changed in the PR (0 outside a PR)"
    value: ${{ steps.pr-size.outputs.count }}
  usings-severity:
    description: "Resolved severity of the unused-usings check"
    value: ${{ steps.config.outputs.usings_severity }}
  nullable-severity:
    description: "Resolved severity of the nullable-warnings check"
    value: ${{ steps.config.outputs.nullable_severity }}
 
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ inputs.dotnet-version }}
 
    # Fails the job on an invalid .relgate.yml rather than silently using
    # defaults - a typo must not weaken the gate.
    - name: Load RelGate config
      id: config
      shell: bash
      env:
        CONFIG_FILE: ${{ inputs.config-file }}
      run: bash "${{ github.action_path }}/scripts/resolve-config.sh"
 
    - name: Restore
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
      run: bash "${{ github.action_path }}/scripts/restore.sh"
 
    - name: Get changed .cs files
      if: inputs.changed-files-only == 'true'
      id: changed
      uses: tj-actions/changed-files@v45
      with:
        separator: "\n"
        files: "**/*.cs"
 
    - name: Check unused usings
      id: usings
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        CHANGED_ONLY: ${{ inputs.changed-files-only }}
        CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        USINGS_SEVERITY: ${{ steps.config.outputs.usings_severity }}
        RELGATE_EXCLUDE: ${{ steps.config.outputs.exclude }}
      run: bash "${{ github.action_path }}/scripts/check-usings.sh"
 
    - name: Check nullable warnings and build health
      id: nullable
      shell: bash
      env:
        PROJECT_PATH: ${{ inputs.project-path }}
        CHANGED_ONLY: ${{ inputs.changed-files-only }}
        CHANGED_FILES: ${{ steps.changed.outputs.all_changed_files }}
        NULLABLE_SEVERITY: ${{ steps.config.outputs.nullable_severity }}
        RELGATE_EXCLUDE: ${{ steps.config.outputs.exclude }}
      run: bash "${{ github.action_path }}/scripts/check-nullable-and-build.sh"
 
    - name: Get all changed files for PR size
      if: github.event_name == 'pull_request'
      id: all-changed
      uses: tj-actions/changed-files@v45
      with:
        separator: "\n"
        files: "**/*"
 
    - name: Check PR size (advisory)
      id: pr-size
      shell: bash
      env:
        CHANGED_FILES: ${{ steps.all-changed.outputs.all_changed_files }}
        PR_SIZE_THRESHOLD: ${{ inputs.pr-size-threshold }}
      run: bash "${{ github.action_path }}/scripts/check-pr-size.sh"
 
    - name: Post consolidated PR comment
      if: |
        !cancelled() &&
        github.event_name == 'pull_request' &&
        inputs.skip-comment != 'true'
      uses: actions/github-script@v7
      with:
        script: |
          const usingsCount = ${{ steps.usings.outputs.count || 0 }};
          const nullableCount = ${{ steps.nullable.outputs.count || 0 }};
          const prFileCount = ${{ steps.pr-size.outputs.count || 0 }};
          const prSizeThreshold = ${{ inputs.pr-size-threshold }};
          const toolError =
            '${{ steps.usings.outputs.tool_error }}' === 'true';
          const buildFailed =
            '${{ steps.nullable.outputs.build_failed }}' === 'true';
 
          // Severities come from .relgate.yml (blocking | advisory | off);
          // only 'blocking' findings fail the check or count toward the
          // status, and 'off' checks get no row.
          const usingsCfg =
            '${{ steps.config.outputs.usings_severity }}' || 'blocking';
          const nullableCfg =
            '${{ steps.config.outputs.nullable_severity }}' || 'advisory';
          const label = (cfg, count) => (count > 0
            ? (cfg === 'blocking' ? '🔴 Blocking' : '🟡 Advisory')
            : '🟢 Clean');
          const usingsBlocking = usingsCfg === 'blocking';
 
          const totalBlocking =
            (usingsBlocking ? usingsCount : 0) +
            (usingsBlocking && toolError ? 1 : 0) +
            (buildFailed ? 1 : 0) +
            (nullableCfg === 'blocking' ? nullableCount : 0);
          const status = totalBlocking > 0
            ? '❌ Blocking issues found'
            : '✅ Clean';
 
          const prSizeSeverity =
            prFileCount > prSizeThreshold ? '🟡 Advisory' : '🟢 Clean';
          const rows = [];
          if (usingsCfg !== 'off') {
            rows.push(
              `| Unused usings | ${label(usingsCfg, usingsCount)} | ` +
              `${usingsCount} |`
            );
          }
          if (nullableCfg !== 'off') {
            rows.push(
              `| Nullable warnings | ${label(nullableCfg, nullableCount)} | ` +
              `${nullableCount} |`
            );
          }
          if (buildFailed) {
            rows.push('| Build | 🔴 Blocking | Failed to compile |');
          }
          if (toolError && usingsCfg !== 'off') {
            rows.push(
              `| Lint tool | ${usingsBlocking ? '🔴 Blocking' : '🟡 Advisory'}` +
              ' | Failed to run |'
            );
          }
          rows.push(
          `| PR size | ${prSizeSeverity} | ${prFileCount} ` +
          `file${prFileCount === 1 ? '' : 's'} changed |`
          );
 
          const hideProHint = '${{ inputs.hide-pro-hint }}' === 'true';
          const marker = '<!-- relgate-report -->';
          const year = new Date().getFullYear();
          const body = [
            marker,
            `### RelGate report – ${status}`,
            '',
            '| Category | Severity | Count |',
            '|---|---|---|',
            ...rows,
            '',
            usingsCount > 0
              ? '_Run `dotnet format style --diagnostics IDE0005` ' +
                'locally to fix._'
              : '',
            '',
            '---',
            hideProHint
              ? null
              : '_RelGate Pro adds a vulnerability readiness score and ' +
                'a secret-leak scan — see the ' +
                '[Pro tier](https://github.com/MigrateIQ/relgate#pro-tier)._',
            hideProHint ? null : '',
            '<!-- relgate-copyright -->',
            `_© ${year} MigrateIQ · ` +
              '[RelGate](https://github.com/MigrateIQ/relgate)_'
          ].filter((line) => line !== null).join('\n');
 
          // Fork PRs get a read-only GITHUB_TOKEN (and some orgs default it
          // to read-only), so posting can 403. That must not fail the
          // check - fall back to the job summary instead.
          try {
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                per_page: 100,
              }
            );
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker)
            );
 
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
          } catch (error) {
            core.warning(
              `RelGate could not post the PR comment (${error.message}) - ` +
              'writing the report to the job summary instead.'
            );
            await core.summary.addRaw(body, true).write();
          }
 
    - name: Fail if blocking issues found
      if: inputs.fail-on-issues == 'true'
      shell: bash
      env:
        USINGS_COUNT: ${{ steps.usings.outputs.count }}
        TOOL_ERROR: ${{ steps.usings.outputs.tool_error }}
        BUILD_FAILED: ${{ steps.nullable.outputs.build_failed }}
        NULLABLE_COUNT: ${{ steps.nullable.outputs.count }}
        USINGS_SEVERITY: ${{ steps.config.outputs.usings_severity }}
        NULLABLE_SEVERITY: ${{ steps.config.outputs.nullable_severity }}
      run: bash "${{ github.action_path }}/scripts/fail-gate.sh"